name: CI

# Runs on every PR and on pushes to main.
#
# This workflow is the ONLY mechanical gate on what reaches main, so it is written on the assumption
# that a human reviewer may not read the diff closely. Everything a reviewer would otherwise be
# relied on to catch, and that a machine can check, is checked here.
#
# npm test includes the merge-blocking gates from LAYER1.md: the air-gap source scan (air-gap-safe
# modules contain no fetch/external URL, and both the resolver and extraction subtrees stay
# dynamic-import only) and the corpus allowlist (test-data/ holds only public, allowlisted parts).
#
# IMPORTANT: "runs" is not "blocks". Until branch protection on main marks the "verify" job a
# REQUIRED status check, a red build does not stop a merge. Enabling that is a one-time repo setting
# and is the single highest-value safety control in this repo.
on:
  pull_request:
  push:
    branches: [main]
  # The two official-tool acceptance jobs at the bottom are RELEASE steps, run on
  # purpose rather than on every commit. See the note above the `ltspice` job.
  workflow_dispatch:
    inputs:
      official_tools:
        description: "Also run the official LTspice and KiCad acceptance jobs"
        type: boolean
        default: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned via .nvmrc so CI and local dev agree. Local dev has run on 21 (non-LTS) while
          # this pins the LTS, which has already caused a real gap: a change verified only on 21 is
          # not verified. Anything that must hold, holds here.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The behavioural verifier is part of the builder: it fits generated
      # models against the datasheet targets. Installing the real executable
      # turns simulator-aware tests from "unverifiable" into measurements.
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Prove ngspice is executing
        run: ngspice --version

      # The emitter oracles. These are not optional extras: the Altium and KiCad
      # tests read our output back with THIRD-PARTY readers, and those tests
      # THROW rather than skip when a reader is missing, deliberately, because a
      # check that quietly stops running is worse than one that fails.
      #
      # They were developed locally and only reached CI once the emitter suite
      # was committed, at which point CI went red on a machine that had none of
      # them. Installing them here is what makes the green tick mean what it says.
      #
      # setup-python rather than the system interpreter: the runner images ship an
      # externally-managed Python (PEP 668) where a plain `pip install` is refused.
      # This puts a writable interpreter first on PATH, and the tests invoke
      # `python3`, so it is the one they get.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PINNED, for the reason tools/altium-oracle/setup.sh pins its AltiumSharp
      # commit: an oracle that silently changes under you is not an oracle. These
      # are the versions the emitter suite was verified against; bumping one is a
      # deliberate edit whose diff is the place to argue about it.
      - name: Install the Python emitter oracles
        run: python3 -m pip install "pyaltiumlib==0.6.2" "kiutils==1.4.8"

      # The second Altium oracle, AltiumSharp, read through tools/altium-oracle.
      # `npm run oracle:build` clones AltiumSharp at a PINNED commit and builds
      # the dumper; the project targets net10.0, so the SDK major must match.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the AltiumSharp oracle
        run: npm run oracle:build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (incl. air-gap scan + corpus allowlist gates)
        run: timeout 10m npm test

      # Run the suite again. node:test executes files in PARALLEL and this codebase has already
      # shipped two flaky races (rate-limiter singletons, fetch mutation). A single green run does
      # not distinguish "passes" from "passed this time".
      - name: Tests again (flake detection)
        run: timeout 10m npm test

      # The production build catches what tsc and tests do not: bundling errors, server/client
      # boundary violations, and anything that only fails when Next actually compiles the app.
      - name: Production build
        run: npm run build

      # DOES THE APPLICATION ACTUALLY RUN IN A BROWSER?
      #
      # On 2026-08-24 this product was found to have been serving a DEAD PAGE for its whole life:
      # the CSP blocked the inline scripts Next boots from, React never hydrated, and choosing a
      # datasheet did nothing because the file input had no handler bound to it. Every step above
      # this line was green throughout. Nothing in this repo had ever loaded the page.
      #
      # The default pass is free and makes no model call: it loads the production build, proves it
      # hydrated, walks the settings screen and the first-run gate, and fails on any console error,
      # uncaught exception or failed request. That is the entire class above.
      #
      # It does NOT cover upload, parse and export. Those need a real model call, which costs money
      # and cannot run here; `npm run bench:browser -- --full` is the pre-release step for them and
      # is named as such rather than pretended at.
      - name: Install a browser for the end-to-end pass
        run: npx playwright install --with-deps chromium

      - name: The app runs in a browser
        run: npm run bench:browser

      # A public repo. Committing a key is unrecoverable once pushed, so this is cheap insurance
      # rather than a judgement call left to whoever opens the PR.
      - name: Secret scan
        run: |
          if git grep -nEI \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' \
            -- . ':!package-lock.json'; then
            echo "::error::Possible secret committed. Remove it and rotate the credential."
            exit 1
          fi
          echo "No secret-shaped strings found."

      # Advisory only: this repo carries pre-existing transitive advisories from next/eslint, so
      # failing on them would make CI permanently red and train everyone to ignore it. Surfaced so a
      # NEW one is at least visible in the log.
      - name: Dependency audit (advisory)
        run: npm audit --audit-level=critical || true

  ltspice:
    name: official LTspice acceptance
    runs-on: macos-latest
    timeout-minutes: 20
    # RELEASE STEP, NOT A PER-PUSH GATE. Run it from the Actions tab
    # ("Run workflow"), which is what the `workflow_dispatch` trigger is for.
    #
    # This is where package.json already puts it: `bench:model-release` is
    # `bench:model-capabilities && bench:model-coverage && bench:ltspice`. Putting
    # it on every push duplicated a release script into the commit path, and it
    # has never once been green there.
    #
    # Kept separate because downloading a desktop simulator on every push
    # is slow and brittle. The runner below distinguishes simulator startup
    # failures from rejected netlists and stops after the first infrastructure
    # failure, so a first-run dialog cannot masquerade as 23 model failures.
    if: github.event_name == 'workflow_dispatch' && inputs.official_tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unpack official LTspice
        shell: bash
        run: |
          package="$RUNNER_TEMP/LTspice.pkg"
          expanded="$RUNNER_TEMP/LTspice-expanded"
          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output "$package" "https://LTspice.analog.com/download/MacOS/latest/LTspice.pkg"

          # This checks Apple's installer signature and notarization before any
          # downloaded executable is launched. No privileged install is needed.
          pkgutil --check-signature "$package"
          pkgutil --expand-full "$package" "$expanded"
          binary="$(find "$expanded" -type f -path '*/LTspice.app/Contents/MacOS/LTspice' -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "::error::The official package contained no LTspice executable."
            exit 1
          fi
          echo "LTSPICE_BIN=$binary" >> "$GITHUB_ENV"
      - name: Run every generated class and vendor adapter in official LTspice
        run: npm run bench:ltspice

  kicad:
    name: official KiCad acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # RELEASE STEP, NOT A PER-PUSH GATE, for the reason on the `ltspice` job.
    # package.json already puts this one inside `bench:cad-release`.
    #
    # Tracked fixtures make this self-contained on a fresh runner. A developer's
    # ignored replay cache is useful additional breadth when present, but it is
    # never required for this official-reader gate to exercise real output.
    if: github.event_name == 'workflow_dispatch' && inputs.official_tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install official KiCad CLI
        run: sudo apt-get update && sudo apt-get install -y kicad
      - name: Run every generated symbol and footprint in KiCad
        run: npm run bench:kicad -- --gate
